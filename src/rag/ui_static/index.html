<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OARC Chat Assistant</title>
    <link rel="icon" href="/ui-static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/ui-static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" aria-label="Gateway status">
        <div class="brand-block">
          <h1>OARC Chat Assistant</h1>
          <p id="model-line">Checking gateway</p>
        </div>
        <div class="topbar-actions">
          <div class="status-group" aria-live="polite">
            <span id="health-pill" class="status-pill status-pending">Checking</span>
            <span id="vector-pill" class="status-pill">Vector store</span>
          </div>
          <button
            id="theme-button"
            type="button"
            class="icon-button"
            aria-pressed="false"
            title="Switch to dark mode"
          >
            Dark
          </button>
          <button id="clear-button" type="button" class="icon-button" title="Clear chat">
            Clear
          </button>
        </div>
      </header>

      <main class="chat-layout">
        <section class="conversation-panel" aria-label="Chat conversation">
          <div id="conversation" class="conversation" aria-live="polite"></div>
          <details class="details-tray" hidden>
            <summary>
              <span>Sources and run details</span>
              <span id="request-id">None</span>
            </summary>
            <div class="details-grid">
              <section>
                <h2>Sources</h2>
                <div id="sources" class="sources empty-state">No sources yet.</div>
              </section>
              <section>
                <h2>Run</h2>
                <dl class="detail-list">
                  <div>
                    <dt>Provider</dt>
                    <dd id="provider-line">Unknown</dd>
                  </div>
                  <div>
                    <dt>Base URL</dt>
                    <dd id="base-url-line">Unknown</dd>
                  </div>
                </dl>
                <pre id="metadata" class="metadata">{}</pre>
              </section>
            </div>
          </details>
          <form id="chat-form" class="composer">
            <label class="sr-only" for="question-input">Message</label>
            <input
              id="file-input"
              type="file"
              accept=".txt,.md,.markdown,.pdf,text/plain,text/markdown,application/pdf"
              multiple
              hidden
            />
            <div
              id="attachment-list"
              class="attachment-list"
              aria-live="polite"
              hidden
            ></div>
            <p id="attachment-policy" class="attachment-policy" hidden></p>
            <div class="composer-box">
              <textarea
                id="question-input"
                name="question"
                rows="1"
                autocomplete="off"
                placeholder="Message OARC Chat Assistant"
                required
              ></textarea>
              <div class="composer-actions">
                <button
                  id="attach-button"
                  type="button"
                  class="icon-button"
                  disabled
                  title="Attach file"
                >
                  Attach
                </button>
                <button
                  id="stop-button"
                  type="button"
                  class="icon-button"
                  disabled
                  title="Stop generation"
                >
                  Stop
                </button>
                <button
                  id="send-button"
                  type="submit"
                  class="send-button"
                  title="Send message"
                >
                  Send
                </button>
              </div>
            </div>
          </form>
        </section>
      </main>
    </div>
    <script src="/ui-static/app.js" defer></script>
  </body>
</html>
