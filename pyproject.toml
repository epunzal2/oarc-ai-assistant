[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oarc-ai-assistant"
version = "0.1.0"
description = "Retrieval-Augmented Generation system for OARC documentation and HPC deployments."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "OARC AI Assistant Maintainers" }
]
dependencies = [
  "beautifulsoup4>=4.12.0",
  "faiss-cpu>=1.7.4",
  "fastapi>=0.115.0",
  "flask>=3.0.0",
  "huggingface_hub>=0.23.0",
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-huggingface>=0.3.0",
  "libmagic>=1.0",
  "llama-cpp-python>=0.2.90",
  "presidio-analyzer>=2.2.0",
  "presidio-anonymizer>=2.2.0",
  "pypdf>=6.0.0",
  "python-dotenv>=1.0.0",
  "qdrant-client>=1.8.0",
  "requests>=2.32.0",
  "sentence-transformers>=2.6.0",
  "streamlit>=1.35.0",
  "tiktoken>=0.6.0",
  "torch>=2.1.0",
  "unstructured[md]>=0.12.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.7.0",
]
vllm = [
  "vllm>=0.4.0",
]
sglang = [
  "sglang>=0.3.4",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
